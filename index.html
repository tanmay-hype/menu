<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1a3a; --bg:#cfc2ff; --dot:#b9a8f7; --card:#fff; --muted:#4a4770;
  --pink:#ff5c9a; --lime:#c7f464; --sun:#ffd84d; --sky:#7fd1ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:18px 18px;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
.page{max-width:1100px;margin:0 auto;padding:0 16px 56px}

/* header: the restaurant name is the sticker everything else orbits */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:30px 0 20px}
.logo{width:74px;height:74px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);box-shadow:4px 4px 0 var(--ink);overflow:hidden;transform:rotate(-6deg)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{
  margin:0;display:inline-block;max-width:100%;padding:8px 18px 12px;background:var(--card);
  border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.5deg);
  font-weight:800;font-size:clamp(2.2rem,10vw,4.6rem);line-height:.98;letter-spacing:-.035em;overflow-wrap:anywhere;
}
.sub{margin:0;font-size:1.15rem;font-weight:600}

/* sticky search + category chips */
.bar{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:var(--bg)}
#q{
  width:100%;padding:13px 18px;font:inherit;font-size:1rem;color:var(--ink);background:var(--card);
  border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);
}
#q::placeholder{color:#7a77a0}
#chips{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:9px 16px;font:inherit;font-weight:600;color:var(--ink);background:var(--card);
  border:2.5px solid var(--ink);border-radius:999px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
:is(.chip,#q,.card):focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* sections */
section{margin-top:22px}
.cat{margin:0 0 22px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.cat span{padding:4px 14px 6px;background:var(--c);border:2.5px solid var(--ink);border-radius:12px;display:inline-block;transform:rotate(1.5deg);box-shadow:3px 3px 0 var(--ink)}
.grid{display:grid;gap:26px 20px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}

/* dish card */
.card{
  position:relative;display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px;cursor:pointer;
  background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;
}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.pic{position:relative;width:104px;height:104px;border:2.5px solid var(--ink);border-radius:14px;background:var(--c);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:2.6rem}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
h3{margin:0;padding-right:62px;font-size:1.12rem;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.desc{margin:0;color:var(--muted);font-size:.93rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .desc{-webkit-line-clamp:unset;display:block}
.price{
  position:absolute;top:-13px;right:12px;padding:3px 12px 5px;background:var(--sun);
  border:2.5px solid var(--ink);border-radius:999px;font-weight:800;font-size:1.05rem;transform:rotate(3deg);
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{padding:2px 10px 3px;border:2px solid var(--ink);border-radius:999px;font-size:.85rem;font-weight:600}
.rate{background:var(--pink)}
.fave{background:var(--lime)}
.empty{margin:40px 0;text-align:center;font-size:1.2rem;font-weight:600}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
h1:empty{display:none}
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="logo" id="logoWrap" hidden><img id="logo" alt=""></div>
    <h1 id="name"></h1>
    <p class="sub">what are we eating today?</p>
  </header>

  <div class="bar">
    <input id="q" type="search" placeholder="search a dish" aria-label="Search dishes" autocomplete="off">
    <nav id="chips" aria-label="Categories"></nav>
  </div>

  <main id="menu"><p class="empty">loading the menu...</p></main>
</div>

<script>
// Menu data comes from your Google Sheet through the Apps Script link (?api=menu).
const API_URL = "https://script.google.com/macros/s/AKfycby0OH2MuN4zueR6knHPEJr-T6tHnmwixoWk0UheWQB1x9vT3K6Uwbb0c87sCAM3kcHduQ/exec?api=menu";
const CACHE_KEY = 'menu_cache_v1';
const CODES = { INR: '₹', USD: '$', EUR: '€', GBP: '£' };
const COLORS = ['--pink', '--lime', '--sun', '--sky'];
const EXTRAS = 'Extras';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isTrue = v => v === true || String(v).toLowerCase() === 'true';
const isCode = p => /^[A-Za-z]{3}$/.test(p);

let SYMBOL = '₹', items = [], order = [], cats = [], active = 'all', query = '';

const fmt = p => {
  const n = parseFloat(String(p).replace(/[^0-9.]/g, ''));
  return isNaN(n) ? '' : SYMBOL + (Number.isInteger(n) ? n : n.toFixed(2));
};

function card(ci){
  return i => {
    const r = parseFloat(i.rating);
    const price = fmt(i.price);
    return '<article class="card" tabindex="0" style="--c:var(' + COLORS[ci % 4] + ')">' +
      (price ? '<span class="price">' + esc(price) + '</span>' : '') +
      '<div class="pic">' + esc(String(i.name).charAt(0).toUpperCase()) +
        (i.image ? '<img src="' + esc(i.image) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</div>' +
      '<div class="body"><h3>' + esc(i.name) + '</h3>' +
      (i.description ? '<p class="desc">' + esc(i.description) + '</p>' : '') +
      (r > 0 ? '<div class="tags"><span class="tag rate">&#9733; ' + r.toFixed(1) + '</span>' +
        (r >= 4.5 ? '<span class="tag fave">fan fave</span>' : '') + '</div>' : '') +
      '</div></article>';
  };
}

function renderChips(){
  $('chips').innerHTML = ['all'].concat(cats).map(c =>
    '<button class="chip" data-c="' + esc(c) + '" aria-pressed="' + (c === active) + '">' + esc(c) + '</button>'
  ).join('');
}

function render(){
  const q = query.trim().toLowerCase();
  let html = '';
  order.forEach((c, ci) => {
    if (active !== 'all' && active !== c) return;
    const list = items.filter(i => i._cat === c &&
      (!q || (i.name + ' ' + (i.description || '')).toLowerCase().indexOf(q) > -1));
    if (!list.length) return;
    html += '<section><h2 class="cat" style="--c:var(' + COLORS[ci % 4] + ')"><span>' + esc(c) + '</span></h2>' +
      '<div class="grid">' + list.map(card(ci)).join('') + '</div></section>';
  });
  $('menu').innerHTML = html || '<p class="empty">nothing matches that. try another word.</p>';
}

// Called with cached data first (instant), then again with fresh data from the sheet.
function load(DATA){
  const S = DATA.settings || {};
  const cp = (S.currency || []).map(p => String(p).trim()).filter(Boolean);
  SYMBOL = cp.find(p => !isCode(p)) || CODES[(cp.find(isCode) || '').toUpperCase()] || '₹';

  items = DATA.menu_items || [];
  order = (DATA.categories || []).map(c => String(c).trim());
  items.forEach(i => {
    i._cat = isTrue(i.isAdditional) ? EXTRAS : (String(i.category || '').trim() || 'More');
    if (order.indexOf(i._cat) < 0) order.push(i._cat);
  });
  cats = order.filter(c => items.some(i => i._cat === c));
  if (active !== 'all' && cats.indexOf(active) < 0) active = 'all';

  $('name').textContent = S.name || 'menu';
  document.title = (S.name || 'Menu') + ' menu';
  if (S.logo_light) { $('logo').src = S.logo_light; $('logoWrap').hidden = false; }
  renderChips();
  render();
}

$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  active = b.dataset.c;
  renderChips();
  render();
});
$('q').addEventListener('input', e => { query = e.target.value; render(); });
$('menu').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) c.classList.toggle('open');
});
$('menu').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) {
    e.preventDefault();
    e.target.classList.toggle('open');
  }
});

let cached = null;
try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
if (cached) load(cached);

fetch(API_URL)
  .then(r => r.json())
  .then(d => {
    if (d.error) throw new Error(d.error);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
    load(d);
  })
  .catch(() => {
    if (!cached) $('menu').innerHTML = '<p class="empty">couldn\'t load the menu. check your connection and refresh.</p>';
  });
</script>
</body>
</html>
